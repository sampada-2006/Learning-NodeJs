<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="output.css">
  <title>Airbnb Home</title>
</head>

<body class="font-['Arial'] m-0 p-0 bg-[#f5f5f5]">

  <header class="bg-[#ff5a5f] px-8 py-4 shadow-[0px_2px_8px_rgba(0,0,0,0.1)]">

    <nav class="flex justify-between items-center">

      <ul class="list-none m-0 p-0 flex">

        <li class="ml-5">
          <a 
            href="/"
            class="no-underline text-white font-bold px-4 py-2 rounded hover:bg-[#e54e52] transition-colors duration-300"
          >
            Go to Home
          </a>
        </li>

        <li class="ml-5">
          <a 
            href="/host/add-home"
            class="no-underline text-white font-bold px-4 py-2 rounded hover:bg-[#e54e52] transition-colors duration-300"
          >
            Add Home
          </a>
        </li>

      </ul>

    </nav>

  </header>

  <main class="text-center py-20 px-8 bg-white shadow-[0_4px_8px_rgba(0,0,0,0.1)] my-8 mx-auto max-w-[600px] rounded-lg">

    <h2 class="text-[#333] text-4xl">
      Welcome to Airbnb
    </h2>

  </main>

</body>
</html>
